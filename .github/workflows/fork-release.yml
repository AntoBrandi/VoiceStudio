# Fork release: every push to main publishes a Linux AppImage as a GitHub
# release on this fork. Installed copies find it through the in-app updater,
# whose feed is the repository in config/app.json (`releaseRepository`).
# Upstream's multi-platform pipeline (electron-release.yml) stays disabled here.
#
# Version: the upstream base X.Y.Z from package.json plus a fork build number,
# `X.Y.Z-beta.<1000 + run number>`. The updater only understands `X.Y.Z` and
# `X.Y.Z-beta.N`; numbers from 1000 never collide with upstream's beta tags, and
# the version is stamped at build time only, so merging upstream never conflicts
# with a fork version bump.
name: Fork release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'changelog.d/**'
      - 'mobile/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; a newer push waits instead of racing the publish.
concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  omnivoice-tts:
    # Same build as build-omnivoice-tts.yml's linux-x86_64 leg, cached until the
    # pinned runtime or its build scripts change.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned omnivoice.cpp SHA
        id: pin
        run: |
          sha=$(python3 -c "import json; print(json.load(open('backend/engines/omnivoice_gguf/quant_map.json'))['_meta']['runtime_commit_sha'])")
          [[ "$sha" =~ ^[0-9a-fA-F]{7,40}$ ]] || { echo "::error::invalid runtime_commit_sha '$sha'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Restore the cached runtime
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: omnivoice-tts-linux-x86_64-${{ steps.pin.outputs.sha }}-${{ hashFiles('scripts/build-omnivoice-tts.sh', 'scripts/lib/omnivoice-vulkan.sh') }}
      - name: Vulkan dev deps
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/apt-retry.sh install glslc libvulkan-dev spirv-headers
      - name: Build omnivoice-tts
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          PIN_SHA: ${{ steps.pin.outputs.sha }}
        run: bash scripts/build-omnivoice-tts.sh --platform linux-x86_64 --commit-sha "$PIN_SHA"
      - name: Check the runtime, Vulkan module and resident server
        run: |
          ls bin/ | grep -q 'ggml-vulkan' || { echo "::error::built without the ggml-vulkan module"; exit 1; }
          for name in omnivoice-tts-linux-x86_64 tts-server-linux-x86_64; do
            test -s "bin/$name" || { echo "::error::did not build $name"; exit 1; }
            grep -q "  $name\$" bin/checksums.sha256 || { echo "::error::checksums.sha256 does not list $name"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnivoice-tts-linux-x86_64
          retention-days: 3
          if-no-files-found: error
          path: |
            bin/omnivoice-tts-linux-x86_64*
            bin/tts-server-linux-x86_64*
            bin/libggml*
            bin/checksums.sha256

  package:
    needs: omnivoice-tts
    # Jammy keeps the bundled native code on glibc 2.35, as upstream's installers.
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      VOICESTUDIO_RUST_TARGET: x86_64-unknown-linux-gnu
      VOICESTUDIO_OMNIVOICE_TTS_PLATFORM: linux-x86_64
      VOICESTUDIO_UPDATE_CHANNEL: electron-stable-linux-x64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stamp the fork version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('-')[0]")
          version="$base-beta.$((1000 + GITHUB_RUN_NUMBER))"
          sed -i -E "0,/^  \"version\": \"[^\"]+\"/s//  \"version\": \"$version\"/" package.json
          sed -i -E "s/^version = \"[^\"]+\"/version = \"$version\"/" pyproject.toml
          sed -i -E "s/^_FALLBACK_VERSION = \"[^\"]+\"/_FALLBACK_VERSION = \"$version\"/" backend/core/version.py
          test "$(node -p "require('./package.json').version")" = "$version"
          grep -qx "version = \"$version\"" pyproject.toml
          grep -qx "_FALLBACK_VERSION = \"$version\"" backend/core/version.py
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Fork version: $version"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/desktop-bridge -> target
          key: fork-electron-x86_64-unknown-linux-gnu
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.13'
          enable-cache: false
      - name: Linux native dependencies
        run: bash .github/scripts/apt-retry.sh install libasound2-dev libxdo-dev libxtst-dev libx11-dev libxkbcommon-dev libwayland-dev libssl-dev pkg-config xvfb zsync
      - name: Bundle pinned uv
        run: node electron/scripts/stage-bundled-uv.mjs
      - name: Stage the OmniVoice GGUF runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: omnivoice-tts-linux-x86_64
          path: electron/build/omnivoice-tts
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck and build
        run: |
          bun run --cwd electron typecheck
          bun run --cwd electron build
          bun run --cwd electron build:web
          node electron/tests/packaging-contract.mjs
      - name: Package the AppImage
        working-directory: electron
        run: |
          bun x electron-builder --config electron-builder.config.mjs --linux AppImage --x64 --publish never
          node scripts/embed-appimage-update.mjs
          node tests/packaging-contract.mjs --artifact
          node tests/update-package-contract.mjs --platform linux --arch x64
      - name: Bundled native code must run on glibc 2.35
        run: python3 scripts/check_glibc_floor.py electron/release/linux-unpacked/resources/native
      - name: Packaged startup smoke test
        working-directory: electron
        run: |
          for image in release/VoiceStudio-*-linux-x64.AppImage; do
            VOICESTUDIO_PACKAGED_EXE="electron/$image" xvfb-run -a node tests/packaged-smoke.mjs --setup
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release-linux-x64
          retention-days: 3
          if-no-files-found: error
          path: |
            electron/release/VoiceStudio-*-linux-x64.AppImage
            electron/release/VoiceStudio-*-linux-x64.AppImage.zsync
            electron/release/electron-stable-linux-x64-linux.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-release-linux-x64
          path: dist
      - name: Publish the release
        run: |
          tag="v$VERSION"
          # The Beta channel setting reads the beta manifest; both channels get this build.
          cp dist/electron-stable-linux-x64-linux.yml dist/electron-beta-linux-x64-linux.yml
          previous=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          {
            echo "Fork build of \`${GITHUB_SHA::9}\`."
            if [ -n "$previous" ] && git rev-parse -q --verify "refs/tags/$previous" >/dev/null; then
              echo
              echo "Changes since $previous:"
              git log --first-parent --format='- %s (%h)' "$previous..$GITHUB_SHA" | head -50
            fi
          } > notes.md
          # A re-run of the same run number replaces its own release.
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "VoiceStudio $VERSION" \
            --notes-file notes.md \
            --latest
